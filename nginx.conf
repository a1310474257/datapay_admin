# DataPay Admin Nginx 配置
# - 静态资源走 SPA fallback（所有非 /api 路径返回 index.html）
# - /api/* 反向代理到后端容器（datapay-server:8080）
# - 压缩 + 缓存 + 静态资源长期缓存

upstream datapay_backend {
    server datapay-server:8080;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 200m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml application/xml+rss
               text/javascript image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # 反向代理到后端
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_pass http://datapay_backend;
    }

    # 静态 hash 资源长期缓存
    location ~* \.(?:js|css|woff2?|ttf|eot|ico|png|jpe?g|gif|webp|svg)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
